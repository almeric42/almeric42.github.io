<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель заявок</title>
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#f4f7fb;--card:#fff;--ink:#1c2633;--muted:#5d6b7d;--line:#dbe4ee;--accent:#2f6fed;--green:#1fa96a;--warn:#e5a50a;--red:#d9462f}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:.8rem .8rem 3rem}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
  .bar h1{font-size:1.15rem;margin:0}.bar .cnt{font-size:.85rem;color:var(--muted)}
  .login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50}
  .login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.5rem;width:100%;max-width:320px;box-shadow:0 10px 30px rgba(28,50,90,.1)}
  .login h2{margin:0 0 .3rem;font-size:1.1rem}.login p{color:var(--muted);font-size:.85rem}
  .login input{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;font:inherit;margin:1rem 0 .6rem}
  .login button{width:100%;border:none;background:var(--accent);color:#fff;font-weight:700;padding:.75rem;border-radius:10px;cursor:pointer}
  #err{color:var(--red);font-size:.85rem;min-height:1.1em}
  .zay{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:.85rem 1rem;margin-top:.7rem}
  .zay.newx{border-left-color:var(--accent)}
  .zay .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.77rem;color:var(--muted)}
  .zay h3{margin:.15rem 0 .25rem;font-size:1.02rem}
  .urg{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:#eee}
  .urg-срочно{background:#ffe0da;color:var(--red)}.urg-сегодня-завтра{background:#fff3d6;color:#946200}.urg-не срочно,.urg-не{background:#e6f6ee;color:var(--green)}
  .meta{font-size:.82rem;color:var(--muted);margin:.12rem 0}
  .svc{font-size:.8rem;color:var(--accent);margin:.2rem 0;font-weight:600}
  .msg{margin:.45rem 0 0;font-size:.93rem;white-space:pre-wrap}
  .empty{color:var(--muted);text-align:center;padding:2rem}
  .refresh{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem;color:var(--accent);font-weight:600;cursor:pointer;margin-bottom:.4rem}
  .title{font-weight:800;color:var(--accent);margin:.6rem 0 .2rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>📥 Заявки</h1><span class="cnt" id="cnt"></span></div>
  <button class="refresh" id="reload">⟳ Обновить</button>
  <div id="list"></div>
</div>

<!-- Экран входа -->
<div class="login" id="login">
  <div class="box">
    <h2>Панель заявок</h2>
    <p>Введите ключ, чтобы видеть заявки.</p>
    <input type="password" id="p" placeholder="Ключ" autofocus>
    <button id="go">Войти</button>
    <div id="err"></div>
  </div>
</div>

<script>
(function(){
  // ⭐ ССЫЛКА на ваш Google Apps Script (замените)
  var APP_URL = "https://script.google.com/macros/s/AKfycby5pCIwXVF4vWlctlzOwQdJASe9jhWSv4F3SDFnu9SnNen4zwY2cCQwj2gZ4rG4UHSt/exec";
  // ⭐ Ключ должен совпадать с PANEL_KEY из Code.gs
  var PANEL_KEY = "sekret123";

  var key = "";
  try { key = localStorage.getItem("zk_key") || ""; } catch(e){}

  var list = document.getElementById("list");
  var login = document.getElementById("login");
  var cnt = document.getElementById("cnt");

  function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  if (key) { login.style.display="none"; load(); }
  else { login.style.display="flex"; }

  document.getElementById("go").onclick = function(){
    var v = document.getElementById("p").value.trim();
    if (!v) return;
    key = v;
    try{localStorage.setItem("zk_key", v);}catch(e){}
    login.style.display="none";
    load();
  };

  function load(){
    fetch(APP_URL + "?p=" + encodeURIComponent(key) + "&list=1")
      .then(function(r){return r.json();})
      .then(function(items){
        if (items && items.error) { login.style.display="flex"; document.getElementById("err").textContent="Неверный ключ"; return; }
        cnt.textContent = (items?items.length:0) + " заявок";
        list.innerHTML = (items && items.length)
          ? items.map(render).join("")
          : '<div class="empty">Пока заявок нет.</div>';
      })
      .catch(function(){ list.innerHTML='<div class="empty">Не удалось загрузить. Проверьте интернет.</div>'; });
    // автообновление
    setTimeout(load, 20000);
  }

  function render(o){
    var u = esc(o["Срочность"]||"не срочно");
    var cls = (u && u.indexOf("срочно")>-1) ? "urg-срочно" : "urg-не";
    var date = o["Дата"] ? new Date(o["Дата"]).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
    return '<div class="zay">'+
      '<div class="top"><span>'+esc(date)+'</span><span class="urg '+cls+'">'+u+'</span></div>'+
      '<h3>'+esc(o["Имя"])+'</h3>'+
      '<div class="meta">📞 '+esc(o["Контакт"])+' <span style="color:var(--muted)">('+esc(o["Устройство"]||"")+')</span></div>'+
      (o["Услуги"]?'<div class="svc">'+esc(o["Услуги"])+'</div>':'')+
      (o["Время_связи"]?'<div class="meta">🕒 '+esc(o["Время_связи"])+'</div>':'')+
      '<div class="msg">'+esc(o["Проблема"])+'</div>'+
      '</div>';
  }

  document.getElementById("reload").onclick = function(){ if(key) load(); };
})();
</script>
</body>
</html>
