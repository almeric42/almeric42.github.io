<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель заявок</title>
<meta name="theme-color" content="#16151d">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#16151d;--card:#211f2b;--ink:#edeafa;--muted:#b9b4cf;--line:#35324a;--accent:#7a8cff;--green:#3ecf8e;--warn:#e5a50a;--red:#ff6b5e}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:.8rem .8rem 3rem}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
  .bar h1{font-size:1.15rem;margin:0;color:var(--ink)}.bar .cnt{font-size:.85rem;color:var(--muted)}
  .login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50}
  .login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.5rem;width:100%;max-width:320px}
  .login h2{margin:0 0 .3rem;font-size:1.1rem;color:var(--ink)}.login p{color:var(--muted);font-size:.85rem}
  .login input{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#16151d;color:var(--ink);margin:1rem 0 .6rem}
  .login button{width:100%;border:none;background:var(--accent);color:#16151d;font-weight:700;padding:.75rem;border-radius:10px;cursor:pointer}
  #err{color:var(--red);font-size:.85rem;min-height:1.1em}
  .zay{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:.85rem 1rem;margin-top:.7rem}
  .zay .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.77rem;color:var(--muted)}
  .zay h3{margin:.15rem 0 .25rem;font-size:1.02rem;color:var(--ink)}
  .urg{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:var(--line);color:var(--muted)}
  .urg-срочно{background:#4a1f1a;color:#ff8b80}.urg-сегодня-завтра{background:#4a3a12;color:#f0c060}.urg-не срочно,.urg-не{background:#12402b;color:#5fe8a8}
  .meta{font-size:.82rem;color:var(--muted);margin:.12rem 0}
  .svc{font-size:.8rem;color:var(--accent);margin:.2rem 0;font-weight:600}
  .msg{margin:.45rem 0 0;font-size:.93rem;white-space:pre-wrap;color:var(--ink)}
  .empty{color:var(--muted);text-align:center;padding:2rem}
  .refresh{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem;color:var(--accent);font-weight:600;cursor:pointer;margin-bottom:.4rem}
  .share{background:var(--accent);color:#16151d;border-color:var(--accent);margin-top:.3rem}
  .share:active{opacity:.8}
  .hint{color:var(--muted);font-size:.75rem;text-align:center;margin-top:.5rem}
  .del{display:inline-block;margin-top:.6rem;background:none;border:1px solid #6b3a34;color:#ff8b80;border-radius:9px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer}
  .act{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
  .act .dell{background:none;border:1px solid #6b3a34;color:#ff8b80;border-radius:9px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>📥 Заявки</h1><span class="cnt" id="cnt"></span></div>
  <button class="refresh" id="reload">⟳ Обновить</button>
  <button class="refresh share" id="share">📤 Поделиться сайтом</button>
  <div id="list"></div>
</div>

<!-- Экран входа -->
<div class="login" id="login">
  <div class="box">
    <h2>Панель заявок</h2>
    <p>Введите ключ, чтобы видеть заявки.</p>
    <input type="password" id="p" placeholder="Ключ" autofocus>
    <button id="go">Войти</button>
    <div id="err"></div>
  </div>
</div>

<script>
(function(){
  var APP_URL = "https://script.google.com/macros/s/AKfycbzYc8Lix9yaMkr5u-1hwX2-x7-Lira6QPQwk26i13eb8VDIPzZeKd9KWcDVYl3HQMZB/exec";
  var PANEL_KEY_DEFAULT = "sekret123";

  var list = document.getElementById("list");
  var login = document.getElementById("login");
  var cnt = document.getElementById("cnt");

  function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  // Ключ берём: 1) из URL ?k=..., 2) из localStorage, 3) иначе прячем
  var qp = new URLSearchParams(location.search);
  var aKey = qp.get("k") || "";
  var sKey = ""; try{ sKey = localStorage.getItem("zk_key")||""; }catch(e){}
  var key = aKey || sKey;

  function showLogin(){ login.style.display="flex"; }
  function hideLogin(){ login.style.display="none"; }

  var lastCount = 0;
  var firstLoad = true;

  // Звуковой сигнал (Web Audio — работает в WebView всегда)
  function beep(){
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        var ctx = new C();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = "sine";
        g.gain.value = 0.25;
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        o.stop(ctx.currentTime + 0.35);
        // повторный короткий сигнал
        setTimeout(function(){ try{ var o2=ctx.createOscillator(); var g2=ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination); o2.frequency.value=1100; o2.type="sine"; g2.gain.value=0.2; o2.start(); g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25); o2.stop(ctx.currentTime+0.25); }catch(e){} }, 300);
      }
    } catch(e) {}
  }

  // Системное уведомление (требует разрешения; в WebView может не работать, звук — главный)
  function notify(title, body){
    try {
      if ("Notification" in window) {
        if (Notification.permission === "granted") { new Notification(title, {body: body}); }
        else if (Notification.permission !== "denied") { Notification.requestPermission(); }
      }
    } catch(e) {}
  }

  function load(){
    if (!key) { showLogin(); return; }
    fetch(APP_URL + "?p=" + encodeURIComponent(key) + "&list=1")
      .then(function(r){return r.json();})
      .then(function(items){
        if (items && items.error) { showLogin(); document.getElementById("err").textContent="Неверный ключ"; return; }
        hideLogin();
        var n = (items?items.length:0);
        // уведомление о новой заявке (когда число выросло и это не первый запуск)
        if (firstLoad===false && n > lastCount) {
          beep(); notify("🔔 Новая заявка!", "Только что поступила заявка на компьютерную помощь.");
        }
        firstLoad = false; lastCount = n;
        cnt.textContent = n + " заявок";
        list.innerHTML = (items && items.length)
          ? items.map(render).join("")
          : '<div class="empty">Пока заявок нет.</div>';
      })
      .catch(function(){ list.innerHTML='<div class="empty">Не удалось загрузить. Проверьте интернет.</div>'; });
    setTimeout(load, 20000);
  }

  function render(o){
    var u = esc(o["Срочность"]||"не срочно");
    var cls = (u && u.indexOf("срочно")>-1) ? "urg-срочно" : "urg-не";
    var date = o["Дата"] ? new Date(o["Дата"]).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
    var idx = o.idx;
    return '<div class="zay" data-idx="'+idx+'">'+
      '<div class="top"><span>'+esc(date)+'</span><span class="urg '+cls+'">'+u+'</span></div>'+
      '<h3>'+esc(o["Имя"])+'</h3>'+
      '<div class="meta">📞 '+esc(o["Контакт"])+' <span style="color:var(--muted)">('+esc(o["Устройство"]||"")+')</span></div>'+
      (o["Услуги"]?'<div class="svc">'+esc(o["Услуги"])+'</div>':'')+
      (o["Время_связи"]?'<div class="meta">🕒 '+esc(o["Время_связи"])+'</div>':'')+
      '<div class="msg">'+esc(o["Проблема"])+'</div>'+
      '<div class="act"><button class="dell" data-del="'+idx+'">🗑 Удалить</button></div>'+
      '</div>';
  }

  // Удаление заявки (клик по кнопке)
  document.getElementById("list").addEventListener("click", function(e){
    var btn = e.target.closest("[data-del]");
    if (!btn) return;
    var idx = btn.getAttribute("data-del");
    if (!confirm("Удалить заявку?")) return;
    var all = btn.closest(".zay");
    fetch(APP_URL + "?p=" + encodeURIComponent(key) + "&del=" + idx)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.ok) { load(); }
        else { alert("Не удалось удалить"); }
      });
  });

  document.getElementById("go").onclick = function(){
    var v = document.getElementById("p").value.trim();
    if (!v) return;
    key = v;
    try{localStorage.setItem("zk_key", v);}catch(e){}
    hideLogin();
    load();
  };

  document.getElementById("reload").onclick = function(){ if(key) load(); };

  // Поделиться ссылкой на сайт для клиентов
  function shareSite(){
    var sURL = "https://clck.ru/3Wk8Pi";
    var text = "Компьютерная помощь. Оставьте заявку онлайн за минуту — перезвоню и спишемся: " + sURL;
    // Нативный шеринг Android (работает в WebView с WebChromeClient)
    if (navigator.share) {
      navigator.share({ title: "Компьютерная помощь", text: text, url: sURL })
        .catch(function(){ clipboardShare(text); });
    } else {
      clipboardShare(text);
    }
  }
  function clipboardShare(text){
    // Запасной вариант — скопировать ссылку в буфер
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){
        flash("Ссылка скопирована: https://clck.ru/3Wk8Pi");
      }, function(){ flash("Ссылка: https://clck.ru/3Wk8Pi"); });
    } else {
      flash("Ссылка: https://clck.ru/3Wk8Pi");
    }
  }
  document.getElementById("share").onclick = shareSite;
  function flash(m){
    var d=document.createElement("div"); d.textContent=m;
    d.style.cssText="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.85rem;z-index:99";
    document.body.appendChild(d); setTimeout(function(){d.remove()},2200);
  }

  // Запуск: если ключ известен - сразу грузим список
  if (key) { hideLogin(); load(); }
  else { showLogin(); }
})();
</script>
</body>
</html>
